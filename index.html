<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David García Autos | Conduce a otro nivel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
    <div class="logo">
        <!-- Nombre de archivo simplificado -->
        <img src="logo.jpg" alt="Logo David García Autos" class="logo-img">
        <span class="logo-text">DAVID GARCÍA AUTOS</span>
    </div>
    <ul class="nav-links">
        <li><a href="#inicio">INICIO</a></li>
        <li><a href="#catalogo">CÁTÁLOGO</a></li>
        <li><a href="#nosotros">NOSOTROS</a></li>
    </ul>
    <a href="#contacto" class="btn-contacto">Contacto</a>
</nav>
    <header id="inicio" class="hero">
        <div class="hero-content">
            <h1>CONDUCE A OTRO NIVEL</h1>
        </div>
        <div class="hero-nav-left"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="hero-nav-right"><i class="fa-solid fa-chevron-right"></i></div>
    </header>

    <!-- El resto del código del catálogo se mantiene igual -->
    <section class="marcas-section">
        <h2><span>LAS MARCAS</span> MAS VENDIDAS EN DAVID GARCÍA</h2>
        <div class="marcas-carousel">
            <div class="marcas-logos">
                <span>LAMBORGHINI</span>
                <span>BMW</span>
                <span>CADILLAC</span>
                <span>TOYOTA</span>
                <span>HUMMER</span>
                <span>MAZDA</span>
                <span>MERCEDES</span>
                <span>AUDI</span>
                <span>CHEVROLET</span>
                <span>FORD</span>
            </div>
        </div>
    </section>

    <section id="catalogo" class="catalogo-section">
        <h2 class="catalogo-title">NUESTRO CATÁLOGO DE VEHÍCULOS</h2>
        
        <div class="filtros">
            <div class="filtros-botones">
                <button class="filter-btn active" data-estado="Todos">Todos</button>
                <button class="filter-btn" data-estado="Usado">Usados</button>
                <button class="filter-btn" data-estado="Importado">Importados</button>
            </div>
            <div class="filtro-marca">
                <select id="brand-select">
                    <option value="Todas">Filtrar por Marca: Todas</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Chevrolet">Chevrolet</option>
                    <option value="Mazda">Mazda</option>
                    <option value="BMW">BMW</option>
                    <option value="Audi">Audi</option>
                </select>
            </div>
        </div>

        <div class="car-grid" id="car-grid"></div>
    </section>

    <!-- El modal y los botones flotantes siguen igual -->
    <div id="car-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-modal" id="close-modal"><i class="fa-solid fa-arrow-left"></i> Volver al Catálogo</button>
            <div class="modal-layout">
                <div class="modal-image-container">
                    <div class="modal-image-placeholder" id="modal-image"></div>
                </div>
                <div class="modal-details">
                    <h2 id="modal-title" class="car-title"></h2>
                    <h3 id="modal-price" class="car-price"></h3>
                    <div class="specs-grid" id="modal-specs"></div>
                    <a href="https://wa.me/tu-numero-aqui" class="btn-asesor" target="_blank">CONTACTA A UN ASESOR</a>
                </div>
            </div>
        </div>
    </div>

    <div class="floating-buttons">
        <a href="#" class="float-btn waze"><i class="fa-brands fa-waze"></i></a>
        <a href="https://wa.me/tu-numero-aqui" class="float-btn whatsapp" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
    </div>

    <script src="script.js"></script>
</body>
</html>
