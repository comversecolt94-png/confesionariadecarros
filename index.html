<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David García Autos | Conduce a otro nivel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="logo.jpg" alt="Logo David García Autos" class="logo-img">
            <span class="logo-text">DAVID GARCÍA AUTOS</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#inicio">INICIO</a></li>
            <li><a href="index.html#catalogo">CÁTÁLOGO</a></li>
            <li><a href="nosotros.html">NOSOTROS</a></li>
        </ul>
        <a href="https://api.whatsapp.com/send/?phone=573052630861" class="btn-contacto" target="_blank">Contacto</a>
    </nav>

    <header id="inicio" class="hero">
        <div class="hero-content">
            <h1>CONDUCE A OTRO NIVEL</h1>
        </div>
    </header>

    <section class="marcas-section">
        <h2><span>LAS MARCAS</span> MÁS VENDIDAS</h2>
        <div class="marcas-logos">
            <span>LAMBORGHINI</span>
            <span>BMW</span>
            <span>CADILLAC</span>
            <span>TOYOTA</span>
            <span>AUDI</span>
            <span>CHEVROLET</span>
        </div>
    </section>

    <section id="catalogo" class="catalogo-section">
        <h2 class="catalogo-title">NUESTRO CATÁLOGO DE VEHÍCULOS</h2>
        
        <div class="filtros">
            <div class="filtros-botones">
                <button class="filter-btn active" data-estado="Todos">Todos</button>
                <button class="filter-btn" data-estado="Usado">Usados</button>
                <button class="filter-btn" data-estado="Importado">Importados</button>
            </div>
            <div class="filtro-marca">
                <select id="brand-select">
                    <option value="Todas">Filtrar por Marca: Todas</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Chevrolet">Chevrolet</option>
                    <option value="Mazda">Mazda</option>
                    <option value="BMW">BMW</option>
                    <option value="Audi">Audi</option>
                </select>
            </div>
        </div>

        <div class="car-grid" id="car-grid"></div>
    </section>

    <!-- MODAL ACTUALIZADO -->
    <div id="car-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-modal">
                <i class="fa-solid fa-xmark"></i> CERRAR
            </button>
            
            <div class="modal-main-layout">
                <div id="modal-image" class="modal-image-box">
                    <!-- Aquí el JS inyecta la imagen -->
                </div>
                <div class="modal-info-box">
                    <h2 id="modal-title"></h2>
                    <div id="modal-price" class="modal-price-tag"></div>
                    
                    <div id="modal-specs" class="specs-container">
                        <!-- Aquí el JS inyecta las especificaciones -->
                    </div>

                    <a id="whatsapp-link" href="#" target="_blank" class="btn-asesor-modal">
                        <i class="fa-brands fa-whatsapp"></i> CONTACTAR ASESOR
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="floating-buttons">
        <a href="https://api.whatsapp.com/send/?phone=573052630861" class="float-btn whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
